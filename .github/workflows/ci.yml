name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # `rustsec/audit-check` reports its findings as a check run.
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  RUSTDOCFLAGS: -Dwarnings

jobs:
  # ---------------------------------------------------------------------------
  # Cheap checks. Everything expensive waits on the `basics` gate below.
  # ---------------------------------------------------------------------------
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # `crates/ferrijs-std` is vendored and holds itself out of this with
      # its own `rustfmt.toml` (`disable_all_formatting`); the workspace
      # `ignore` key is nightly-only and only warns here.
      - run: cargo fmt --all -- --check

  typos:
    name: Spell check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: crate-ci/typos@v1

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `ferrijs-std` is excluded: it is vendored llrt, and its intra-doc
      # links are upstream's to fix. Holding it to `-Dwarnings` would mean
      # editing the tree a re-sync has to diff against.
      #
      # `ferrijs-cli` is excluded because its binary is named `ferrijs`, so
      # rustdoc writes it to the same `target/doc/ferrijs` the `ferrijs` lib
      # uses. The two racing to create that directory fails the job with an
      # I/O error, and the binary has no documentation worth publishing.
      # Renaming the binary is not an option: it is the command's name.
      - run: cargo doc --workspace --exclude ferrijs-std --exclude ferrijs-cli --all-features --no-deps

  basics:
    name: Basics gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [fmt, typos, clippy, doc]
    if: always()
    steps:
      - name: Verify all checks passed
        run: |
          jq -ce '.[] | select(.result != "success")' <<< '${{ toJson(needs) }}' \
            && echo "One or more basic checks failed" && exit 1 \
            || echo "Basics green"

  # ---------------------------------------------------------------------------
  # The suite. Linux and macOS are where the hosts run; Windows is here
  # because ferrimock ships a Windows CLI, and a `cfg(windows)` dependency
  # this crate forgot to declare only failed once that CLI was built.
  # ---------------------------------------------------------------------------
  test:
    name: Tests (${{ matrix.os }})
    needs: [basics]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --all-features --no-fail-fast
      # nextest cannot run doc tests.
      - run: cargo test --doc --workspace --all-features

  # ---------------------------------------------------------------------------
  # A feature a host turns off must still compile without it: `fetch` is
  # optional because ferrimock builds the realm `without_fetch`.
  # ---------------------------------------------------------------------------
  features:
    name: Feature combinations
    needs: [basics]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@cargo-hack
      # `js-dump-leaks` is excluded: it is a debug flag compiled into the
      # QuickJS runtime, not a surface a consumer selects.
      - run: cargo hack check -p ferrijs --each-feature --no-dev-deps --exclude-features js-dump-leaks
      - run: cargo hack check -p ferrijs-permissions --each-feature --no-dev-deps

  # ---------------------------------------------------------------------------
  # The declared `rust-version`, checked on exactly that toolchain rather
  # than on whatever stable happens to be. A floor nobody compiles at
  # drifts: this workspace claimed 1.91 while `sysinfo` needed 1.95 and
  # rolldown's oxc tree needed 1.96.
  # ---------------------------------------------------------------------------
  msrv:
    name: MSRV 1.97
    needs: [basics]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --all-features

  # ---------------------------------------------------------------------------
  # Catch publish rot before release day: a file the manifest excludes, a
  # path dependency with no `version`, a README that is not in the package.
  #
  # `--workspace` rather than a per-crate `cargo publish --dry-run`, because
  # a dry run resolves each sibling from crates.io even with `--no-verify`,
  # and until the first release none of these are there. Packaging the
  # workspace resolves them against each other instead.
  # ---------------------------------------------------------------------------
  packaging:
    name: Package
    needs: [basics]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo package --workspace --no-verify

  security:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  lockfile:
    name: Lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --locked --workspace --all-features

  # ---------------------------------------------------------------------------
  # One required check for branch protection.
  # ---------------------------------------------------------------------------
  conclusion:
    name: CI conclusion
    if: always()
    needs: [test, features, msrv, packaging, security, lockfile]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Result
        run: |
          jq -ce '.[] | select(.result != "success" and .result != "skipped")' <<< '${{ toJson(needs) }}' \
            && echo "Some jobs failed" && exit 1 \
            || echo "All jobs passed or were skipped"
