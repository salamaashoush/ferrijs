# One advisory is accepted, and only this one. Everything else fails CI.
[advisories]
ignore = [
  # RUSTSEC-2023-0071, the Marvin attack: `rsa`'s PKCS#1 v1.5 padding is
  # not constant-time, so an attacker who can time a private-key
  # operation can recover the key.
  #
  # There is nothing to upgrade to. `rsa 0.10.0-rc.18` is the newest
  # published version and RustSec records no patched or unaffected
  # release; the fix is the constant-time rewrite tracked in
  # RustCrypto/RSA#626, which is still open. `ferrijs-std` needs the
  # crate for WebCrypto's RSASSA-PKCS1-v1_5, RSA-PSS and RSA-OAEP, so
  # the alternative is deleting three algorithms from `crypto.subtle`.
  #
  # What it means for a host: the attack needs an attacker who can
  # observe the timing of an RSA operation on a key they do not have. An
  # embedded realm doing WebCrypto over its own keys is not that; a
  # realm that lets untrusted script sign with a host key over a network
  # the caller times, is. Do not build the second one on this crate.
  #
  # Revisit when RustCrypto/RSA#626 closes.
  "RUSTSEC-2023-0071",
]
