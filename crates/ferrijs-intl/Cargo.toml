[package]
name = "ferrijs-intl"
description = "ECMA-402 Intl for the ferrijs QuickJS runtime, on ICU4X with compiled data: Intl.* and the locale-sensitive String, Number, BigInt and Date methods."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["javascript", "quickjs", "intl", "icu4x", "i18n"]
categories = ["internationalization", "localization"]

[lints]
workspace = true

[dependencies]
ferrijs-std = { workspace = true }
rquickjs = { workspace = true }
rustc-hash = { workspace = true }
# `unstable` is what serves `icu_experimental` (relative time, display
# names, currency, unit and compact number formats). Its API is not
# semver-stable, so the version is pinned exactly.
icu_provider = "=2.4.0"
fixed_decimal = { version = "0.7", features = ["ryu"] }
writeable = "0.6"
icu = { version = "=2.4.0", features = ["compiled_data", "unstable"] }
# Instant to wall time in a named zone needs the zone's real
# transitions, which ICU4X's data does not carry; jiff reads the
# platform's tzdb and falls back to the copy it bundles.
jiff = { version = "1", default-features = false, features = ["std", "tz-system", "tz-fat", "tzdb-zoneinfo", "tzdb-concatenated", "tzdb-bundle-always"] }

[dev-dependencies]
rquickjs = { workspace = true }
